; Tesserae client for the Pimoroni Inky Frame 7.3" (Raspberry Pi Pico W, RP2040).
;
; Framework: the official Raspberry Pi Pico SDK ("picosdk") as packaged by the
; maxgerhardt fork of the PlatformIO raspberrypi platform. The W board pulls in
; the CYW43 driver and lwIP; include/lwipopts.h configures lwIP.

[platformio]
default_envs = inkyframe

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = picosdk
build_flags =
    -DPIO_STDIO_USB
    -Wall -Wextra -Wno-unused-parameter
extra_scripts =
    pre:scripts/lwip_prepend.py
monitor_speed = 115200
upload_port = /dev/cu.usbmodem*

; Production build for the original 7-colour (ACeP) Inky Frame 7.3".
[env:inkyframe]
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_ACEP

; Same firmware for a Spectra 6 (E673) panel, the revision shipped from Sept 2025.
[env:inkyframe_spectra]
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_SPECTRA

; Bench self-test: no Tesserae involved. Downloads and paints tools/make_test_frames.py
; output from a local HTTP server (python3 -m http.server 8000 in the tools folder).
[env:inkyframe_selftest]
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_ACEP
    -DDEV_BOOT_LOG_DELAY_MS=3000
    -DSELFTEST_BASE_URL=\"http://192.168.1.153:8000\"

; Spectra 6 Inky Frame with a Pico 2 W (RP2350) aboard: the board Pimoroni
; ships the Spectra revision with.
[env:inkyframe2_spectra]
board = rpipico2w
build_flags =
    ${env.build_flags}
    -DPANEL_VARIANT=PANEL_SPECTRA
